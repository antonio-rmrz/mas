# How the harness (fiesta Close) renders this repo's PR body and names its
# branches. Placeholders are substituted by the harness; a line whose
# placeholder cannot be resolved is replaced by its declared fallback.
issue_key_pattern: 'MWPW-\d+'
# Branch naming, in order of preference: the Jira key alone, then a kebab slug
# of the title. Key-first is load-bearing beyond readability here: M@S's IMS
# client regex only accepts `MWPW-XXXXXX`-named branch previews (repo README),
# so any authenticated surface (studio.html) only works from a key-named
# branch. The harness lowercases, kebab-sanitizes and length-caps the result
# so the aem.page preview hostname always resolves.
branch_pattern: ['{issue_key}', '{title_slug}']
page: /web-components/docs/merch-card.html
fallbacks:
    issue_key: 'Resolves: <!-- link the MWPW Jira ticket, e.g. [MWPW-0000](…) -->'
    # No visual evidence this run (gate skipped or nothing capturable): keep the
    # Before/After line shape with honest placeholders instead of a guessed pair
    # that nobody verified.
    test_urls: |-
        - Before: https://main--mas--antonio-rmrz.aem.page/web-components/docs/merch-card.html?martech=off
        - After: <!-- no verified visual evidence this run — see the run dashboard -->
template: |
    {summary_bullets}

    Resolves: [{issue_key}](https://jira.corp.adobe.com/browse/{issue_key})

    **Test URLs** (the before/after pair the harness visually verified):
    {test_urls}
